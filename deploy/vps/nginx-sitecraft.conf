# T-204: SiteCraft on the owner's VPS. Install as /etc/nginx/conf.d/sitecraft.conf.
# Cloudflare Tunnel (installed by the owner) forwards both hostnames to http://localhost:80.
# This file adds two server blocks only; it does not touch enchanted.conf or the xray proxy on 443.

# Visitor address as seen by Cloudflare, trusted only when the request comes through the local tunnel.
# Per-IP limits are the second line of defence behind the app's one-task-per-workspace queue.
limit_req_zone $binary_remote_addr zone=sitecraft_api:10m rate=2r/s;      # whole API incl. 2 s progress polling
limit_req_zone $binary_remote_addr zone=sitecraft_heavy:10m rate=10r/m;   # hydrate, undo/restore, manual commit
limit_req_status 429;

# No request headers (keys travel in headers), no query strings, no bodies.
log_format sitecraft_min '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent $request_time';

server {
    listen 80;
    server_name sitecraft.luckye.online;
    access_log /var/log/nginx/sitecraft-landing.log sitecraft_min;
    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    real_ip_header CF-Connecting-IP;

    root /opt/sitecraft/landing;
    index index.html;
    location / { try_files $uri $uri/ =404; }
    location ~* \.(jpg|webp|png|css)$ { expires 7d; }
}

server {
    listen 80;
    server_name sitecraftapp.luckye.online;
    access_log /var/log/nginx/sitecraft-app.log sitecraft_min;
    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    real_ip_header CF-Connecting-IP;

    # Only the local tunnel may reach the app: plain HTTP from outside would carry keys unencrypted.
    # (real_ip changes $remote_addr, so test the connecting socket address instead.)
    if ($realip_remote_addr !~ ^(127\.0\.0\.1|::1)$) { return 403; }

    # Matches the app's hydrate limit: 20 MB decoded, base64 adds a third.
    client_max_body_size 29m;
    proxy_read_timeout 600s;   # a manual commit may wait in the single queue
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_http_version 1.1;

    location ~ ^/api/(workspace/hydrate|sites/[^/]+/(history/[a-z]+|draft))$ {
        limit_req zone=sitecraft_heavy burst=10 nodelay;
        limit_req zone=sitecraft_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:3100;
    }
    location /api/ {
        limit_req zone=sitecraft_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:3100;
    }
    location / {
        proxy_pass http://127.0.0.1:3100;
    }
}
