# T-204, T-207: SiteCraft on the owner's VPS. Install as /etc/nginx/conf.d/sitecraft.conf.
# Cloudflare Tunnel (installed by the owner) forwards both hostnames to http://localhost:80.
# This file owns port 80: the two SiteCraft hosts plus a default that drops any other Host.
# It does not touch the xray proxy on 443.

# No request headers, no query strings, no bodies.
log_format sitecraft_min '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent $request_time';

# Unknown hostnames (including the retired enchanted.luckye.online) get no page instead of the landing.
server {
    listen 80 default_server;
    server_name _;
    access_log off;
    return 444;
}

server {
    listen 80;
    server_name sitecraft.luckye.online;
    add_header Cache-Control "no-transform" always;
    access_log /var/log/nginx/sitecraft-landing.log sitecraft_min;
    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    real_ip_header CF-Connecting-IP;

    root /opt/sitecraft/landing;
    index index.html;
    location / { try_files $uri $uri/ =404; }
    location ~* \.(jpg|webp|png|css)$ { expires 7d; }
}

server {
    listen 80;
    server_name sitecraftapp.luckye.online;
    add_header Cache-Control "no-transform" always;
    access_log /var/log/nginx/sitecraft-app.log sitecraft_min;
    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    real_ip_header CF-Connecting-IP;

    # T-207: a static, step-by-step demo of the workspace with preset data. Nothing here calls a
    # model or reaches the (stopped) sitecraft-app on 127.0.0.1:3100.
    root /opt/sitecraft/demo;
    index index.html;
    location / { try_files $uri $uri/ =404; }
}
