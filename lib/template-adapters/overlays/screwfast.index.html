<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>工程工业首页</title>
    <style>
      /* Catalog book: white product plates, key specs on the card, the full list folded away.
         The accent appears as the top rule, the buttons and the series labels only. */
      :root {
        --site-bg: #f4f5f3;
        --site-surface: #ffffff;
        --site-ink: #151817;
        --site-muted: #5e6762;
        --site-line: #d7ddd8;
        --site-accent: #d9652b;
        --site-accent-strong: #ad451d;
        --site-accent-soft: #fff0e8;
        --site-diagram: #e8ece8;
        --site-tint: #eef4f0;
        --site-radius: 4px;
        --site-font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", sans-serif;
      }
      * { box-sizing: border-box; }
      html { background: var(--site-bg); color: var(--site-ink); font-family: var(--site-font); overflow-x: hidden; -webkit-font-smoothing: antialiased; scroll-behavior: smooth; }
      @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
      body { margin: 0; min-width: 320px; background: var(--site-bg); color: var(--site-ink); overflow-x: hidden; }
      a { color: inherit; text-decoration: none; }
      button, input, textarea { font: inherit; }
      img { display: block; max-width: 100%; }
      [hidden] { display: none !important; }
      .sitecraft-container { width: min(100% - 48px, 1200px); margin: 0 auto; }

      .sitecraft-rule { height: 4px; background: var(--site-accent); }
      .sitecraft-nav { position: relative; z-index: 5; background: var(--site-surface); border-bottom: 1px solid var(--site-line); }
      .sitecraft-nav-inner { display: flex; align-items: center; justify-content: space-between; gap: 28px; min-height: 72px; }
      .sitecraft-brand { display: flex; align-items: center; gap: 12px; min-width: 0; font-weight: 700; font-size: 18px; letter-spacing: -0.01em; }
      .sitecraft-brand-mark { width: 30px; height: 30px; flex: none; background: var(--site-ink); position: relative; }
      .sitecraft-brand-mark::after { content: ""; position: absolute; inset: 0; background: var(--site-accent); clip-path: polygon(100% 0, 100% 100%, 0 100%); }
      .sitecraft-brand-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .sitecraft-nav-links { display: flex; align-items: center; gap: 26px; font-size: 14px; color: var(--site-muted); }
      .sitecraft-nav-links a:hover { color: var(--site-ink); }
      .sitecraft-nav-tools { display: flex; align-items: center; gap: 12px; flex: none; }
      .sitecraft-locale-switch { display: inline-flex; border: 1px solid var(--site-line); }
      .sitecraft-locale-switch button { border: 0; background: transparent; padding: 7px 10px; font-size: 12px; font-weight: 700; color: var(--site-muted); cursor: pointer; }
      .sitecraft-locale-switch button.active { background: var(--site-ink); color: #fff; }
      .sitecraft-btn { display: inline-flex; align-items: center; justify-content: center; min-height: 46px; padding: 0 22px; border: 1px solid transparent; font-size: 15px; font-weight: 650; cursor: pointer; }
      .sitecraft-primary { background: var(--site-accent-strong); color: #fff; }
      .sitecraft-primary:hover { background: var(--site-ink); }
      .sitecraft-secondary { background: var(--site-surface); border-color: var(--site-line); color: var(--site-ink); }
      .sitecraft-secondary:hover { border-color: var(--site-ink); }
      .sitecraft-nav .sitecraft-btn { min-height: 40px; padding: 0 16px; font-size: 14px; }
      .sitecraft-menu { display: none; position: relative; }
      .sitecraft-menu summary { list-style: none; cursor: pointer; padding: 9px 14px; border: 1px solid var(--site-line); font-size: 14px; font-weight: 600; }
      .sitecraft-menu summary::-webkit-details-marker { display: none; }
      .sitecraft-menu-panel { position: absolute; right: 0; top: calc(100% + 8px); min-width: 210px; display: grid; background: var(--site-surface); border: 1px solid var(--site-line); box-shadow: 0 14px 30px rgba(0, 0, 0, 0.08); }
      .sitecraft-menu-panel a { padding: 13px 16px; border-bottom: 1px solid var(--site-line); font-size: 15px; }
      .sitecraft-menu-panel a:last-child { border-bottom: 0; }
      a:focus-visible, button:focus-visible, summary:focus-visible { outline: 2px solid var(--site-accent); outline-offset: 2px; }

      /* Hero: one statement, one action, then a photo, or a nameplate of key specs, or nothing. */
      .sitecraft-hero { background: var(--site-surface); border-bottom: 1px solid var(--site-line); }
      .sitecraft-hero-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); gap: 56px; align-items: center; padding: 64px 0 72px; }
      .sitecraft-hero[data-sitecraft-hero-mode="none"] .sitecraft-hero-grid { grid-template-columns: minmax(0, 1fr); }
      .sitecraft-eyebrow { margin: 0 0 18px; font-size: 13px; color: var(--site-muted); letter-spacing: 0.02em; }
      .sitecraft-hero h1 { margin: 0; max-width: 16em; font-size: clamp(34px, 4.6vw, 58px); line-height: 1.1; letter-spacing: -0.03em; font-weight: 750; text-wrap: balance; overflow-wrap: anywhere; }
      .sitecraft-hero-copy { margin: 22px 0 0; max-width: 34em; font-size: 18px; line-height: 1.6; color: var(--site-muted); }
      .sitecraft-hero-actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 32px; }
      .sitecraft-hero-visual { margin: 0; }
      .sitecraft-hero-photo { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; background: var(--site-diagram); }
      .sitecraft-hero-credit { margin: 8px 0 0; font-size: 12px; color: var(--site-muted); }
      .sitecraft-nameplate { margin: 0; padding: 32px 34px; display: grid; grid-template-columns: 1fr 1fr; gap: 24px 28px; background: var(--site-ink); color: #fff; }
      .sitecraft-nameplate-cell dt { font-size: 13px; color: rgba(255, 255, 255, 0.66); }
      .sitecraft-nameplate-cell dd { margin: 6px 0 0; font-size: 26px; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
      .sitecraft-hero-specs { background: var(--site-ink); color: #fff; border-top: 3px solid var(--site-accent); }
      .sitecraft-hero-specs dl { margin: 0 auto; display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); }
      .sitecraft-hero-spec { padding: 18px 22px; border-left: 1px solid rgba(255, 255, 255, 0.14); }
      .sitecraft-hero-spec:last-child { border-right: 1px solid rgba(255, 255, 255, 0.14); }
      .sitecraft-hero-spec dt { font-size: 12px; color: rgba(255, 255, 255, 0.62); }
      .sitecraft-hero-spec dd { margin: 5px 0 0; font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }

      .sitecraft-section { padding: 80px 0; border-bottom: 1px solid var(--site-line); }
      .sitecraft-section-head { display: flex; justify-content: space-between; align-items: end; gap: 32px; margin-bottom: 36px; }
      .sitecraft-section h2 { margin: 0; font-size: clamp(27px, 3vw, 38px); letter-spacing: -0.02em; line-height: 1.15; }
      .sitecraft-section-intro { margin: 0; max-width: 32em; color: var(--site-muted); font-size: 16px; line-height: 1.6; }

      /* Product family cards. */
      .sitecraft-product-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 24px; }
      .sitecraft-product-card { display: flex; flex-direction: column; background: var(--site-surface); border: 1px solid var(--site-line); }
      .sitecraft-product-media { aspect-ratio: 16 / 10; background: var(--site-diagram); overflow: hidden; }
      .sitecraft-product-image { width: 100%; height: 100%; object-fit: cover; }
      .sitecraft-product-body { flex: 1; display: flex; flex-direction: column; gap: 14px; padding: 26px 28px 24px; }
      .sitecraft-product-category { margin: 0; font-size: 13px; font-weight: 600; color: var(--site-accent-strong); }
      .sitecraft-product-card h3 { margin: 0; font-size: 24px; letter-spacing: -0.01em; }
      .sitecraft-product-keys { margin: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-top: 1px solid var(--site-line); border-bottom: 1px solid var(--site-line); }
      .sitecraft-product-key { padding: 14px 12px 14px 0; }
      .sitecraft-product-key + .sitecraft-product-key { padding-left: 14px; border-left: 1px solid var(--site-line); }
      .sitecraft-product-key dt { font-size: 12px; color: var(--site-muted); }
      .sitecraft-product-key dd { margin: 4px 0 0; font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
      .sitecraft-product-card[data-sitecraft-product-photo="false"] .sitecraft-product-key dd { font-size: 22px; }
      .sitecraft-product-summary { margin: 0; color: var(--site-muted); line-height: 1.6; }
      .sitecraft-product-more summary { cursor: pointer; list-style: none; font-size: 14px; font-weight: 600; color: var(--site-accent-strong); }
      .sitecraft-product-more summary::-webkit-details-marker { display: none; }
      .sitecraft-product-more summary::after { content: " +"; }
      .sitecraft-product-more[open] summary::after { content: " −"; }
      .sitecraft-product-specs { width: 100%; margin-top: 10px; border-collapse: collapse; font-size: 14px; }
      .sitecraft-product-specs th, .sitecraft-product-specs td { padding: 9px 0; border-bottom: 1px solid var(--site-line); text-align: left; vertical-align: top; }
      .sitecraft-product-specs th { width: 44%; color: var(--site-muted); font-weight: 500; }
      .sitecraft-product-specs td { font-variant-numeric: tabular-nums; }
      .sitecraft-product-foot { margin-top: auto; padding-top: 6px; display: grid; gap: 6px; }
      .sitecraft-product-ask { justify-self: start; font-size: 14px; font-weight: 650; }
      .sitecraft-product-ask::after { content: " →"; }
      .sitecraft-product-ask:hover { color: var(--site-accent-strong); }
      .sitecraft-product-image-credit { margin: 0; font-size: 12px; color: var(--site-muted); }
      .sitecraft-product-empty { margin: 0; color: var(--site-muted); }

      /* Industries and capabilities read as two lists side by side; either may be absent. */
      .sitecraft-pair { padding: 80px 0; border-bottom: 1px solid var(--site-line); }
      .sitecraft-pair:not(:has(> .sitecraft-container > section:not([data-sitecraft-section-hidden="true"]))) { display: none; }
      .sitecraft-pair > .sitecraft-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 56px; }
      .sitecraft-list h2 { margin: 0 0 8px; font-size: 26px; letter-spacing: -0.02em; }
      .sitecraft-list .sitecraft-section-intro { margin-bottom: 20px; font-size: 15px; }
      .sitecraft-catalog-grid { border-top: 2px solid var(--site-ink); }
      .sitecraft-catalog-card { display: grid; grid-template-columns: minmax(0, 11em) minmax(0, 1fr); gap: 16px; padding: 15px 0; border-bottom: 1px solid var(--site-line); }
      .sitecraft-catalog-card h3 { margin: 0; font-size: 16px; font-weight: 650; }
      .sitecraft-catalog-card p { margin: 0; color: var(--site-muted); line-height: 1.55; }

      /* How we work: short numbered steps only when the draft provides them. */
      .sitecraft-process { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: 0; border-top: 2px solid var(--site-ink); counter-reset: step; }
      .sitecraft-process-card { counter-increment: step; padding: 18px 20px 20px 0; border-bottom: 1px solid var(--site-line); }
      .sitecraft-process-card::before { content: counter(step); display: block; margin-bottom: 10px; font-size: 13px; font-weight: 700; color: var(--site-accent-strong); }
      .sitecraft-process-card h3 { margin: 0 0 6px; font-size: 17px; }
      .sitecraft-process-card p { margin: 0; color: var(--site-muted); line-height: 1.55; }

      .sitecraft-cert-grid { display: flex; flex-wrap: wrap; gap: 12px; border-top: 0; }
      .sitecraft-cert-grid .sitecraft-catalog-card { display: flex; align-items: center; gap: 14px; padding: 14px 18px; background: var(--site-surface); border: 1px solid var(--site-line); }
      .sitecraft-cert-grid .sitecraft-catalog-card p:not(.sitecraft-cert-status) { display: none; }
      .sitecraft-cert-status { padding: 3px 8px; border: 1px solid currentColor; font-size: 12px; color: var(--site-accent-strong); }

      .sitecraft-faq-list { border-top: 2px solid var(--site-ink); }
      .sitecraft-faq-item { border-bottom: 1px solid var(--site-line); }
      .sitecraft-faq-item summary { cursor: pointer; padding: 16px 0; font-weight: 650; list-style: none; }
      .sitecraft-faq-item summary::-webkit-details-marker { display: none; }
      .sitecraft-faq-answer p { margin: 0 0 16px; color: var(--site-muted); line-height: 1.6; }

      /* Inquiry: its own tinted band, contact lines once, a short form. */
      .sitecraft-inquiry { background: var(--site-tint); }
      .sitecraft-inquiry-wrap { display: grid; grid-template-columns: minmax(0, 0.8fr) minmax(0, 1.2fr); gap: 56px; align-items: start; }
      .sitecraft-inquiry-copy > p { margin: 14px 0 0; color: var(--site-muted); line-height: 1.6; }
      .sitecraft-inquiry-lines { margin: 24px 0 0; padding: 0; list-style: none; border-top: 1px solid var(--site-line); }
      .sitecraft-inquiry-lines li { display: flex; gap: 16px; padding: 12px 0; border-bottom: 1px solid var(--site-line); }
      .sitecraft-inquiry-lines li > span:first-child { min-width: 3em; color: var(--site-muted); }
      .sitecraft-inquiry-form { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 28px; background: var(--site-surface); border: 1px solid var(--site-line); }
      .sitecraft-inquiry-form label { display: grid; gap: 6px; font-size: 13px; color: var(--site-muted); }
      .sitecraft-inquiry-form label[data-sitecraft-inquiry-label="email"], .sitecraft-inquiry-form label[data-sitecraft-inquiry-label="message"] { grid-column: 1 / -1; }
      .sitecraft-inquiry-form input, .sitecraft-inquiry-form textarea { width: 100%; padding: 11px 12px; border: 1px solid var(--site-line); background: var(--site-bg); color: var(--site-ink); font-size: 15px; }
      .sitecraft-inquiry-form input:focus, .sitecraft-inquiry-form textarea:focus { outline: 2px solid var(--site-accent); outline-offset: 1px; }
      .sitecraft-inquiry-form textarea { min-height: 120px; resize: vertical; }
      .sitecraft-inquiry-form button, .sitecraft-inquiry-status { grid-column: 1 / -1; }
      .sitecraft-inquiry-form button { justify-self: start; }
      .sitecraft-inquiry-status { margin: 0; padding: 10px 12px; border-left: 3px solid currentColor; font-size: 14px; line-height: 1.5; }
      [data-sitecraft-inquiry-state="sent"] .sitecraft-inquiry-status { color: #1f6f43; background: rgba(31, 111, 67, 0.08); }
      [data-sitecraft-inquiry-state="error"] .sitecraft-inquiry-status { color: #9a3412; background: rgba(154, 52, 18, 0.08); }
      [data-sitecraft-inquiry-state="sending"] [type="submit"] { opacity: 0.6; cursor: progress; }

      .sitecraft-footer { padding: 56px 0 36px; background: var(--site-ink); color: rgba(255, 255, 255, 0.72); font-size: 14px; }
      .sitecraft-footer-inner { display: grid; grid-template-columns: 1.4fr repeat(3, minmax(0, 1fr)); gap: 32px; }
      .sitecraft-footer-label, .sitecraft-footer-brand { display: block; margin-bottom: 14px; color: #fff; font-size: 15px; font-weight: 650; }
      .sitecraft-footer-links { display: grid; gap: 8px; }
      .sitecraft-footer-links a:hover { color: #fff; }
      .sitecraft-footer-contact { display: grid; gap: 8px; }
      /* When every contact line is a gap, drop the empty list and the footer column with it. */
      .sitecraft-inquiry-lines:not(:has(> li:not([hidden]))) { display: none; }
      .sitecraft-footer-inner > div:has(.sitecraft-footer-contact):not(:has([data-sitecraft-line]:not([hidden]))) { display: none; }
      .sitecraft-benchmark-legacy { display: none !important; }

      @media (max-width: 900px) {
        .sitecraft-container { width: min(100% - 32px, 1200px); }
        .sitecraft-nav-links, .sitecraft-nav .sitecraft-nav-cta { display: none; }
        .sitecraft-menu { display: block; }
        .sitecraft-hero-grid { grid-template-columns: 1fr; gap: 32px; padding: 40px 0 48px; }
        .sitecraft-hero-copy { font-size: 16px; }
        .sitecraft-nameplate { padding: 22px; }
        .sitecraft-nameplate-cell dd { font-size: 20px; }
        .sitecraft-hero-specs dl { grid-auto-flow: row; grid-template-columns: 1fr 1fr; }
        .sitecraft-hero-spec { border-left: 0; border-right: 0 !important; border-bottom: 1px solid rgba(255, 255, 255, 0.14); padding: 14px 16px; }
        .sitecraft-hero-spec dd { font-size: 17px; }
        .sitecraft-section, .sitecraft-pair { padding: 52px 0; }
        .sitecraft-section-head { display: block; margin-bottom: 26px; }
        .sitecraft-section-intro { margin-top: 10px; }
        .sitecraft-product-body { padding: 20px; }
        /* Narrow screens: key specs as name/value rows so units never break. */
        .sitecraft-product-keys { grid-template-columns: 1fr; }
        .sitecraft-product-key, .sitecraft-product-key + .sitecraft-product-key { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-left: 0; }
        .sitecraft-product-key + .sitecraft-product-key { border-top: 1px solid var(--site-line); }
        .sitecraft-product-key dd, .sitecraft-product-card[data-sitecraft-product-photo="false"] .sitecraft-product-key dd { margin: 0; font-size: 16px; }
        .sitecraft-catalog-card { grid-template-columns: 1fr; gap: 4px; }
        .sitecraft-inquiry-wrap { grid-template-columns: 1fr; gap: 36px; }
        .sitecraft-inquiry-form { grid-template-columns: 1fr; padding: 20px; }
        .sitecraft-footer-inner { grid-template-columns: 1fr 1fr; }
        .sitecraft-footer-about { grid-column: 1 / -1; }
      }
    </style>
  </head>
  <body>
    <div class="sitecraft-page">
      <div class="sitecraft-rule" aria-hidden="true"></div>
      <header class="sitecraft-nav" data-sitecraft-section="nav">
        <div class="sitecraft-container sitecraft-nav-inner">
          <a class="sitecraft-brand" href="#top" aria-label="企业首页">
            <span class="sitecraft-brand-mark" aria-hidden="true"></span>
            <span class="sitecraft-brand-name" data-sitecraft-brand="nav">企业名称</span>
          </a>
          <nav class="sitecraft-nav-links" aria-label="主导航">
            <a href="#products" data-sitecraft-nav="products">产品</a>
            <a href="#industries" data-sitecraft-ui="industries">应用行业</a>
            <a href="#capabilities" data-sitecraft-ui="capabilities">加工能力</a>
            <a href="#process" data-sitecraft-nav="services">合作方式</a>
            <a href="#certifications" data-sitecraft-ui="certifications">认证</a>
            <a href="#faq" data-sitecraft-ui="faq">常见问题</a>
          </nav>
          <div class="sitecraft-nav-tools">
            <div class="sitecraft-locale-switch" data-sitecraft-locale-switch hidden>
              <button type="button" data-sitecraft-locale="zh" data-sitecraft-ui="localeZh" aria-pressed="true">中</button>
              <button type="button" data-sitecraft-locale="en" data-sitecraft-ui="localeEn" aria-pressed="false">EN</button>
            </div>
            <a class="sitecraft-btn sitecraft-primary sitecraft-nav-cta" href="#inquiry" data-sitecraft-nav="contact">提交询盘</a>
            <details class="sitecraft-menu">
              <summary data-sitecraft-ui="menu">菜单</summary>
              <nav class="sitecraft-menu-panel" aria-label="菜单">
                <a href="#products" data-sitecraft-ui="products">产品</a>
                <a href="#industries" data-sitecraft-ui="industries">应用行业</a>
                <a href="#capabilities" data-sitecraft-ui="capabilities">加工能力</a>
                <a href="#process" data-sitecraft-ui="services">合作方式</a>
                <a href="#certifications" data-sitecraft-ui="certifications">认证</a>
                <a href="#faq" data-sitecraft-ui="faq">常见问题</a>
                <a href="#inquiry" data-sitecraft-ui="contact">询盘</a>
              </nav>
            </details>
          </div>
        </div>
      </header>
      <main id="top">
        <section class="sitecraft-hero" data-sitecraft-section="hero" data-sitecraft-benchmark="hero">
          <div class="sitecraft-container sitecraft-hero-grid">
            <div>
              <p class="sitecraft-eyebrow" data-sitecraft-optional="industry" hidden></p>
              <h1 data-sitecraft-benchmark="hero-title"></h1>
              <p class="sitecraft-hero-copy" data-sitecraft-benchmark="hero-subtitle" hidden></p>
              <div class="sitecraft-hero-actions">
                <a class="sitecraft-btn sitecraft-primary" data-sitecraft-benchmark="hero-cta" href="#inquiry">提交询盘</a>
                <a class="sitecraft-btn sitecraft-secondary" href="#products" data-sitecraft-ui="viewProducts">看产品系列</a>
              </div>
            </div>
            <figure class="sitecraft-hero-visual" data-sitecraft-hero-visual hidden>
              <img class="sitecraft-hero-photo" data-sitecraft-benchmark="hero-image" alt="" hidden>
              <figcaption class="sitecraft-hero-credit" data-sitecraft-hero-credit hidden></figcaption>
              <dl class="sitecraft-nameplate" data-sitecraft-hero-nameplate hidden></dl>
            </figure>
          </div>
        </section>
        <div class="sitecraft-hero-specs" data-sitecraft-hero-specs hidden><dl class="sitecraft-container"></dl></div>

        <section id="products" class="sitecraft-section" data-sitecraft-section="products">
          <div class="sitecraft-container">
            <div class="sitecraft-section-head">
              <h2 data-sitecraft-benchmark="products-title">产品</h2>
              <p class="sitecraft-section-intro" data-sitecraft-benchmark="products-intro" hidden></p>
            </div>
            <div class="sitecraft-product-grid" data-sitecraft-product-grid></div>
          </div>
        </section>

        <div class="sitecraft-pair">
          <div class="sitecraft-container">
            <section id="industries" class="sitecraft-list" data-sitecraft-section="industries">
              <h2 data-sitecraft-benchmark="industries-title">应用行业</h2>
              <p class="sitecraft-section-intro" data-sitecraft-benchmark="industries-intro" hidden></p>
              <div class="sitecraft-catalog-grid" data-sitecraft-catalog-grid="industries"></div>
            </section>
            <section id="capabilities" class="sitecraft-list" data-sitecraft-section="capabilities">
              <h2 data-sitecraft-benchmark="capabilities-title">加工能力</h2>
              <p class="sitecraft-section-intro" data-sitecraft-benchmark="capabilities-intro" hidden></p>
              <div class="sitecraft-catalog-grid" data-sitecraft-catalog-grid="capabilities"></div>
            </section>
          </div>
        </div>

        <section id="process" class="sitecraft-section" data-sitecraft-section="services">
          <div class="sitecraft-container">
            <div class="sitecraft-section-head">
              <h2 data-sitecraft-benchmark="services-title">合作方式</h2>
              <p class="sitecraft-section-intro" data-sitecraft-benchmark="services-intro" hidden></p>
            </div>
            <div class="sitecraft-process">
              <article class="sitecraft-process-card"><h3 data-sitecraft-benchmark="services-item-0-title"></h3><p data-sitecraft-benchmark="services-item-0-body"></p></article>
