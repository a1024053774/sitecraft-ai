<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>明亮产品页</title>
  <style>
    /* Bright product: white ground, large rounded panels, generous air, the product first.
       Structure follows the engineering sample (T-018); the look stays this family's own. */
    :root { --site-bg: #fff; --site-surface: #fff; --site-ink: #17212b; --site-muted: #5d6872; --site-line: #d8e0e5; --site-accent: #3b6b86; --site-accent-strong: #284d63; --site-accent-soft: #e8f0f4; --site-diagram: #e8eff2; --site-tint: #f3f6f7; --site-radius: 16px; --site-font: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans SC", sans-serif; }
    * { box-sizing: border-box; }
    html { background: var(--site-bg); color: var(--site-ink); font-family: var(--site-font); overflow-x: hidden; -webkit-font-smoothing: antialiased; scroll-behavior: smooth; }
    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
    body { margin: 0; min-width: 320px; background: var(--site-bg); color: var(--site-ink); overflow-x: hidden; }
    a { color: inherit; text-decoration: none; }
    button, input, textarea { font: inherit; }
    img { display: block; max-width: 100%; }
    [hidden] { display: none !important; }
    a:focus-visible, button:focus-visible, summary:focus-visible { outline: 2px solid var(--site-accent); outline-offset: 3px; border-radius: 6px; }
    .sitecraft-container { width: min(100% - 48px, 1180px); margin: 0 auto; }

    .sitecraft-nav { position: relative; z-index: 5; background: var(--site-bg); border-bottom: 1px solid var(--site-line); }
    .sitecraft-nav-inner { min-height: 76px; display: flex; align-items: center; justify-content: space-between; gap: 24px; }
    .sitecraft-brand { display: inline-flex; align-items: center; gap: 11px; min-width: 0; font-weight: 800; letter-spacing: -0.03em; }
    .sitecraft-mark { width: 29px; height: 29px; flex: none; border: 2px solid var(--site-accent); border-radius: 8px; position: relative; }
    .sitecraft-mark::after { content: ""; position: absolute; inset: 6px; border: 2px solid var(--site-ink); border-radius: 3px; }
    .sitecraft-brand-name { font-size: 17px; min-width: 0; line-height: 1.15; white-space: normal; }
    .sitecraft-nav-links { display: flex; align-items: center; gap: 24px; color: var(--site-muted); font-size: 14px; }
    .sitecraft-nav-links a:hover { color: var(--site-ink); }
    .sitecraft-nav-tools { display: flex; align-items: center; gap: 10px; flex: none; }
    .sitecraft-locale-switch { display: inline-flex; padding: 3px; border: 1px solid var(--site-line); border-radius: 999px; }
    .sitecraft-locale-switch button { border: 0; background: transparent; padding: 5px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; color: var(--site-muted); cursor: pointer; }
    .sitecraft-locale-switch button.active { background: var(--site-ink); color: #fff; }
    .sitecraft-primary, .sitecraft-secondary { display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 0 22px; border-radius: 999px; font-size: 15px; font-weight: 700; border: 1px solid transparent; cursor: pointer; }
    .sitecraft-primary { background: var(--site-accent); color: #fff; }
    .sitecraft-primary:hover { background: var(--site-accent-strong); }
    .sitecraft-secondary { border-color: var(--site-line); color: var(--site-ink); background: var(--site-surface); }
    .sitecraft-secondary:hover { border-color: var(--site-ink); }
    .sitecraft-nav .sitecraft-primary { min-height: 40px; padding: 0 18px; font-size: 14px; }
    .sitecraft-menu { display: none; position: relative; }
    .sitecraft-menu summary { list-style: none; cursor: pointer; padding: 9px 16px; border: 1px solid var(--site-line); border-radius: 999px; font-size: 14px; font-weight: 700; }
    .sitecraft-menu summary::-webkit-details-marker { display: none; }
    .sitecraft-menu-panel { position: absolute; right: 0; top: calc(100% + 10px); min-width: 220px; display: grid; padding: 8px; background: var(--site-surface); border: 1px solid var(--site-line); border-radius: var(--site-radius); box-shadow: 0 18px 40px rgba(23, 33, 43, 0.1); }
    .sitecraft-menu-panel a { padding: 12px 14px; border-radius: 10px; font-size: 15px; }
    .sitecraft-menu-panel a:hover { background: var(--site-tint); }

    /* Hero: statement and action left, one large rounded photo panel right (nothing drawn on it). */
    .sitecraft-hero { padding: 72px 0 64px; }
    .sitecraft-hero-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 64px; align-items: center; }
    .sitecraft-hero[data-sitecraft-hero-mode="none"] .sitecraft-hero-grid { grid-template-columns: minmax(0, 1fr); }
    .sitecraft-eyebrow { margin: 0 0 18px; color: var(--site-accent-strong); font-size: 14px; font-weight: 700; }
    .sitecraft-hero h1 { margin: 0; max-width: 14em; font-size: clamp(38px, 5.4vw, 68px); line-height: 1.04; letter-spacing: -0.05em; text-wrap: balance; overflow-wrap: anywhere; }
    .sitecraft-hero-copy { max-width: 32em; margin: 24px 0 0; color: var(--site-muted); font-size: clamp(17px, 1.8vw, 20px); line-height: 1.6; }
    .sitecraft-actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 32px; }
    .sitecraft-hero-visual { margin: 0; }
    .sitecraft-hero-photo { width: 100%; aspect-ratio: 5 / 4; object-fit: cover; border-radius: calc(var(--site-radius) * 1.5); background: var(--site-diagram); }
    .sitecraft-hero-credit { margin: 10px 4px 0; color: var(--site-muted); font-size: 12px; }
    .sitecraft-nameplate { margin: 0; padding: 30px; display: grid; grid-template-columns: 1fr 1fr; gap: 26px 30px; border-radius: calc(var(--site-radius) * 1.5); background: var(--site-tint); border: 1px solid var(--site-line); }
    .sitecraft-nameplate-cell dt { color: var(--site-muted); font-size: 13px; }
    .sitecraft-nameplate-cell dd { margin: 6px 0 0; font-size: 28px; font-weight: 800; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
    /* Key specs under a photo hero: a light row of rounded figures, not a dark band. */
    .sitecraft-hero-specs { padding: 0 0 56px; }
    .sitecraft-hero-specs dl { margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); gap: 12px; }
    .sitecraft-hero-spec { padding: 18px 20px; border-radius: var(--site-radius); background: var(--site-tint); }
    .sitecraft-hero-spec dt { color: var(--site-muted); font-size: 12px; }
    .sitecraft-hero-spec dd { margin: 6px 0 0; font-size: 21px; font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }

    .sitecraft-section { padding: 84px 0; border-top: 1px solid var(--site-line); }
    .sitecraft-section-head { display: grid; grid-template-columns: minmax(0, 0.8fr) minmax(0, 1.2fr); gap: 48px; align-items: end; margin-bottom: 36px; }
    .sitecraft-section h2 { margin: 0; font-size: clamp(30px, 3.6vw, 48px); line-height: 1.05; letter-spacing: -0.045em; }
    .sitecraft-section-intro { max-width: 34em; margin: 0; color: var(--site-muted); font-size: 17px; line-height: 1.6; }

    .sitecraft-product-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 20px; }
    .sitecraft-product-card { display: flex; flex-direction: column; overflow: hidden; border: 1px solid var(--site-line); border-radius: calc(var(--site-radius) * 1.25); background: var(--site-surface); }
    .sitecraft-product-media { aspect-ratio: 16 / 10; background: var(--site-diagram); }
    .sitecraft-product-image { width: 100%; height: 100%; object-fit: cover; }
    .sitecraft-product-body { flex: 1; display: flex; flex-direction: column; gap: 14px; padding: 26px 28px 26px; }
    .sitecraft-product-category { margin: 0; color: var(--site-accent-strong); font-size: 13px; font-weight: 700; }
    .sitecraft-product-card h3 { margin: 0; font-size: 26px; letter-spacing: -0.035em; }
    .sitecraft-product-keys { margin: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
    .sitecraft-product-key { padding: 12px 14px; border-radius: 12px; background: var(--site-tint); }
    .sitecraft-product-key dt { color: var(--site-muted); font-size: 12px; }
    .sitecraft-product-key dd { margin: 4px 0 0; font-size: 17px; font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .sitecraft-product-summary { margin: 0; color: var(--site-muted); line-height: 1.6; }
    .sitecraft-product-more summary { cursor: pointer; list-style: none; color: var(--site-accent-strong); font-size: 14px; font-weight: 700; }
    .sitecraft-product-more summary::-webkit-details-marker { display: none; }
    .sitecraft-product-more summary::after { content: " +"; }
    .sitecraft-product-more[open] summary::after { content: " −"; }
    .sitecraft-product-specs { width: 100%; margin-top: 10px; border-collapse: collapse; font-size: 14px; }
    .sitecraft-product-specs th, .sitecraft-product-specs td { padding: 9px 0; border-bottom: 1px solid var(--site-line); text-align: left; vertical-align: top; }
    .sitecraft-product-specs th { width: 44%; color: var(--site-muted); font-weight: 500; }
    .sitecraft-product-foot { margin-top: auto; padding-top: 4px; display: grid; gap: 6px; }
    .sitecraft-product-ask { justify-self: start; font-size: 14px; font-weight: 700; }
    .sitecraft-product-ask::after { content: " →"; }
    .sitecraft-product-ask:hover { color: var(--site-accent-strong); }
    .sitecraft-product-image-credit { margin: 0; color: var(--site-muted); font-size: 12px; }
    .sitecraft-product-empty { margin: 0; color: var(--site-muted); }

    /* Industries, capabilities, certifications: soft rounded cards. */
    .sitecraft-catalog-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); gap: 14px; }
    .sitecraft-catalog-card { padding: 22px; border-radius: var(--site-radius); background: var(--site-tint); }
    .sitecraft-catalog-card h3 { margin: 0 0 6px; font-size: 18px; letter-spacing: -0.02em; }
    .sitecraft-catalog-card p { margin: 0; color: var(--site-muted); line-height: 1.55; }
    .sitecraft-cert-grid .sitecraft-catalog-card { display: flex; align-items: center; justify-content: space-between; gap: 12px; background: var(--site-surface); border: 1px solid var(--site-line); }
    .sitecraft-cert-grid .sitecraft-catalog-card h3 { margin: 0; }
    .sitecraft-cert-grid .sitecraft-catalog-card p:not(.sitecraft-cert-status) { display: none; }
    .sitecraft-cert-status { padding: 4px 10px; border-radius: 999px; background: var(--site-accent-soft); color: var(--site-accent-strong); font-size: 12px; font-weight: 700; }

    .sitecraft-process { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: 14px; }
    .sitecraft-process-card { padding: 24px; border: 1px solid var(--site-line); border-radius: var(--site-radius); }
    .sitecraft-process-card h3 { margin: 0 0 8px; font-size: 19px; }
    .sitecraft-process-card p { margin: 0; color: var(--site-muted); line-height: 1.55; }

    /* Inquiry: a tinted rounded panel, contact lines once, a short form. */
    .sitecraft-contact-panel { display: grid; grid-template-columns: minmax(0, 0.85fr) minmax(0, 1.15fr); gap: 56px; padding: 48px; border-radius: calc(var(--site-radius) * 1.75); background: var(--site-tint); }
    .sitecraft-contact-copy > p { margin: 14px 0 0; color: var(--site-muted); line-height: 1.6; }
    .sitecraft-contact-lines { margin: 22px 0 0; padding: 0; list-style: none; display: grid; gap: 10px; }
    .sitecraft-contact-lines li { display: flex; gap: 14px; }
    .sitecraft-contact-lines li > span:first-child { color: var(--site-muted); min-width: 3em; }
    .sitecraft-contact-lines:not(:has(> li:not([hidden]))) { display: none; }
    .sitecraft-form { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; padding: 26px; border-radius: var(--site-radius); background: var(--site-surface); }
    .sitecraft-form label { display: grid; gap: 6px; color: var(--site-muted); font-size: 13px; font-weight: 700; }
    .sitecraft-form label[data-sitecraft-inquiry-label="email"], .sitecraft-form label[data-sitecraft-inquiry-label="message"] { grid-column: 1 / -1; }
    .sitecraft-form input, .sitecraft-form textarea { width: 100%; padding: 12px 14px; border: 1px solid var(--site-line); border-radius: 12px; background: var(--site-bg); color: var(--site-ink); outline: none; font-size: 15px; }
    .sitecraft-form input:focus, .sitecraft-form textarea:focus { border-color: var(--site-accent); box-shadow: 0 0 0 3px var(--site-accent-soft); }
    .sitecraft-form textarea { min-height: 120px; resize: vertical; }
    .sitecraft-form button, .sitecraft-inquiry-status { grid-column: 1 / -1; }
    .sitecraft-form button { justify-self: start; }
    .sitecraft-inquiry-status { margin: 0; padding: 10px 14px; border-radius: 10px; font-size: 14px; line-height: 1.5; }
    [data-sitecraft-inquiry-state="sent"] .sitecraft-inquiry-status { color: #1f6f43; background: rgba(31, 111, 67, 0.1); }
    [data-sitecraft-inquiry-state="error"] .sitecraft-inquiry-status { color: #9a3412; background: rgba(154, 52, 18, 0.1); }
    [data-sitecraft-inquiry-state="sending"] [type="submit"] { opacity: 0.6; cursor: progress; }

    .sitecraft-faq-list { display: grid; gap: 10px; }
    .sitecraft-faq-item { padding: 18px 22px; border: 1px solid var(--site-line); border-radius: var(--site-radius); }
    .sitecraft-faq-item h3 { margin: 0; font-size: 16px; }
    .sitecraft-faq-item p { margin: 8px 0 0; color: var(--site-muted); line-height: 1.55; }

    .sitecraft-footer { padding: 48px 0 40px; border-top: 1px solid var(--site-line); color: var(--site-muted); font-size: 14px; }
    .sitecraft-footer-inner { display: grid; grid-template-columns: 1.4fr repeat(3, minmax(0, 1fr)); gap: 28px; }
    .sitecraft-footer-brand, .sitecraft-footer-label { display: block; margin-bottom: 12px; color: var(--site-ink); font-weight: 800; }
    .sitecraft-footer-links, .sitecraft-footer-contact { display: grid; gap: 8px; }
    .sitecraft-footer-links a:hover { color: var(--site-ink); }
    .sitecraft-footer-inner > div:has(.sitecraft-footer-contact):not(:has([data-sitecraft-line]:not([hidden]))) { display: none; }
    .sitecraft-benchmark-legacy { display: none !important; }

    @media (max-width: 900px) {
      .sitecraft-container { width: min(100% - 32px, 1180px); }
      .sitecraft-nav-inner { min-height: 66px; }
      .sitecraft-nav-links, .sitecraft-nav .sitecraft-nav-cta { display: none; }
      .sitecraft-menu { display: block; }
      .sitecraft-hero { padding: 44px 0 40px; }
      .sitecraft-hero-grid, .sitecraft-section-head, .sitecraft-contact-panel { grid-template-columns: 1fr; gap: 28px; }
      .sitecraft-nameplate { padding: 22px; }
      .sitecraft-nameplate-cell dd { font-size: 21px; }
      .sitecraft-hero-specs { padding-bottom: 40px; }
      .sitecraft-section { padding: 56px 0; }
      .sitecraft-product-body { padding: 20px; }
      .sitecraft-product-keys { grid-template-columns: 1fr; }
      .sitecraft-product-key { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
      .sitecraft-product-key dd { margin: 0; font-size: 16px; }
      .sitecraft-contact-panel { padding: 24px; }
      .sitecraft-form { grid-template-columns: 1fr; padding: 20px; }
      .sitecraft-footer-inner { grid-template-columns: 1fr 1fr; }
      .sitecraft-footer-about { grid-column: 1 / -1; }
    }
    @media (max-width: 480px) {
      .sitecraft-hero-specs dl { gap: 6px; }
      .sitecraft-hero-spec { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 12px 16px; }
      .sitecraft-hero-spec dd { margin: 0; font-size: 17px; }
    }
  </style>
</head>
<body>
  <div class="sitecraft-page" data-sitecraft-benchmark="bright-product">
    <header class="sitecraft-nav" data-sitecraft-section="nav">
      <div class="sitecraft-container sitecraft-nav-inner">
        <a class="sitecraft-brand" href="#top" data-sitecraft-brand="nav"><span class="sitecraft-mark" aria-hidden="true"></span><span class="sitecraft-brand-name" data-sitecraft-brand-name="nav">企业名称</span></a>
        <nav class="sitecraft-nav-links" aria-label="主导航">
          <a href="#products" data-sitecraft-nav="products">产品</a>
          <a href="#industries" data-sitecraft-ui="industries">应用行业</a>
          <a href="#capabilities" data-sitecraft-ui="capabilities">加工能力</a>
          <a href="#services" data-sitecraft-nav="services">合作方式</a>
          <a href="#certifications" data-sitecraft-ui="certifications">认证</a>
          <a href="#faq" data-sitecraft-ui="faq">常见问题</a>
        </nav>
        <div class="sitecraft-nav-tools">
          <div class="sitecraft-locale-switch" data-sitecraft-locale-switch hidden>
            <button type="button" data-sitecraft-locale="zh" data-sitecraft-ui="localeZh" aria-pressed="true">中</button>
            <button type="button" data-sitecraft-locale="en" data-sitecraft-ui="localeEn" aria-pressed="false">EN</button>
          </div>
          <a class="sitecraft-primary sitecraft-nav-cta" href="#contact" data-sitecraft-nav="contact">提交询盘</a>
          <details class="sitecraft-menu">
            <summary data-sitecraft-ui="menu">菜单</summary>
            <nav class="sitecraft-menu-panel" aria-label="菜单">
              <a href="#products" data-sitecraft-ui="products">产品</a>
              <a href="#industries" data-sitecraft-ui="industries">应用行业</a>
              <a href="#capabilities" data-sitecraft-ui="capabilities">加工能力</a>
              <a href="#services" data-sitecraft-ui="services">合作方式</a>
              <a href="#certifications" data-sitecraft-ui="certifications">认证</a>
              <a href="#faq" data-sitecraft-ui="faq">常见问题</a>
              <a href="#contact" data-sitecraft-ui="contact">询盘</a>
            </nav>
          </details>
        </div>
      </div>
    </header>
    <main id="top">
      <section class="sitecraft-hero" data-sitecraft-section="hero">
        <div class="sitecraft-container sitecraft-hero-grid">
          <div>
            <p class="sitecraft-eyebrow" data-sitecraft-optional="industry" hidden></p>
            <h1 data-sitecraft-benchmark="hero-title"></h1>
            <p class="sitecraft-hero-copy" data-sitecraft-benchmark="hero-subtitle" hidden></p>
            <div class="sitecraft-actions">
              <a class="sitecraft-primary" data-sitecraft-benchmark="hero-cta" href="#contact">提交询盘</a>
              <a class="sitecraft-secondary" href="#products" data-sitecraft-ui="viewProducts">看产品系列</a>
            </div>
          </div>
          <figure class="sitecraft-hero-visual" data-sitecraft-hero-visual hidden>
            <img class="sitecraft-hero-photo" data-sitecraft-benchmark="hero-image" alt="" hidden>
            <figcaption class="sitecraft-hero-credit" data-sitecraft-hero-credit hidden></figcaption>
            <dl class="sitecraft-nameplate" data-sitecraft-hero-nameplate hidden></dl>
          </figure>
        </div>
      </section>
      <div class="sitecraft-hero-specs" data-sitecraft-hero-specs hidden><dl class="sitecraft-container"></dl></div>

      <section id="products" class="sitecraft-section" data-sitecraft-section="products">
        <div class="sitecraft-container">
          <div class="sitecraft-section-head">
            <h2 data-sitecraft-benchmark="products-title">产品</h2>
            <p class="sitecraft-section-intro" data-sitecraft-benchmark="products-intro" hidden></p>
          </div>
          <div class="sitecraft-product-grid" data-sitecraft-product-grid></div>
        </div>
      </section>

      <section id="industries" class="sitecraft-section" data-sitecraft-section="industries">
        <div class="sitecraft-container">
          <div class="sitecraft-section-head">
            <h2 data-sitecraft-benchmark="industries-title">应用行业</h2>
            <p class="sitecraft-section-intro" data-sitecraft-benchmark="industries-intro" hidden></p>
          </div>
          <div class="sitecraft-catalog-grid" data-sitecraft-catalog-grid="industries"></div>
        </div>
      </section>

      <section id="capabilities" class="sitecraft-section" data-sitecraft-section="capabilities">
        <div class="sitecraft-container">
          <div class="sitecraft-section-head">
            <h2 data-sitecraft-benchmark="capabilities-title">加工能力</h2>
            <p class="sitecraft-section-intro" data-sitecraft-benchmark="capabilities-intro" hidden></p>
          </div>
          <div class="sitecraft-catalog-grid" data-sitecraft-catalog-grid="capabilities"></div>
        </div>
      </section>

      <section id="services" class="sitecraft-section" data-sitecraft-section="services">
        <div class="sitecraft-container">
          <div class="sitecraft-section-head">
            <h2 data-sitecraft-benchmark="services-title">合作方式</h2>
            <p class="sitecraft-section-intro" data-sitecraft-benchmark="services-intro" hidden></p>
          </div>
          <div class="sitecraft-process">
            <article class="sitecraft-process-card"><h3 data-sitecraft-benchmark="services-item-0-title"></h3><p data-sitecraft-benchmark="services-item-0-body"></p></article>
            <article class="sitecraft-process-card"><h3 data-sitecraft-benchmark="services-item-1-title"></h3><p data-sitecraft-benchmark="services-item-1-body"></p></article>
            <article class="sitecraft-process-card"><h3 data-sitecraft-benchmark="services-item-2-title"></h3><p data-sitecraft-benchmark="services-item-2-body"></p></article>
          </div>
        </div>
      </section>

      <section id="certifications" class="sitecraft-section" data-sitecraft-section="certifications">
        <div class="sitecraft-container">
          <div class="sitecraft-section-head">
            <h2 data-sitecraft-benchmark="certifications-title">认证</h2>
            <p class="sitecraft-section-intro" data-sitecraft-benchmark="certifications-intro" hidden></p>
          </div>
          <div class="sitecraft-catalog-grid sitecraft-cert-grid" data-sitecraft-catalog-grid="certifications"></div>
        </div>
      </section>

      <section id="faq" class="sitecraft-section" data-sitecraft-section="faq">
        <div class="sitecraft-container">
          <div class="sitecraft-section-head">
            <h2 data-sitecraft-faq="title">常见问题</h2>
            <p class="sitecraft-section-intro" data-sitecraft-faq="intro" hidden></p>
          </div>
          <div class="sitecraft-faq-list">
            <article class="sitecraft-faq-item"><h3 data-sitecraft-faq="q1"></h3><p data-sitecraft-faq="a1"></p></article>
            <article class="sitecraft-faq-item"><h3 data-sitecraft-faq="q2"></h3><p data-sitecraft-faq="a2"></p></article>
            <article class="sitecraft-faq-item"><h3 data-sitecraft-faq="q3"></h3><p data-sitecraft-faq="a3"></p></article>
          </div>
        </div>
      </section>

      <section id="contact" class="sitecraft-section" data-sitecraft-section="contact">
        <div class="sitecraft-container">
          <div class="sitecraft-contact-panel">
            <div class="sitecraft-contact-copy">
              <h2 data-sitecraft-contact="title">询盘</h2>
              <p data-sitecraft-contact="body" hidden></p>
              <ul class="sitecraft-contact-lines">
                <li data-sitecraft-line><span data-sitecraft-ui="emailPrefix">邮箱</span><strong data-sitecraft-contact="email"></strong></li>
                <li data-sitecraft-line><span data-sitecraft-ui="phonePrefix">电话</span><strong data-sitecraft-contact="phone"></strong></li>
              </ul>
            </div>
            <form class="sitecraft-form" data-sitecraft-inquiry="true" action="#" method="post">
              <label data-sitecraft-inquiry-label="name">姓名<input name="name" required maxlength="80" autocomplete="name"></label>
              <label data-sitecraft-inquiry-label="company">公司<input name="company" maxlength="120" autocomplete="organization"></label>
              <label data-sitecraft-inquiry-label="email">邮箱<input name="email" type="email" required maxlength="160" autocomplete="email"></label>
              <label data-sitecraft-inquiry-label="message">需求<textarea name="message" required maxlength="4000"></textarea></label>
              <input name="honeypot" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px">
              <button class="sitecraft-primary" type="submit" data-sitecraft-ui="submit">发送询盘</button>
            </form>
          </div>
        </div>
      </section>
    </main>
    <footer class="sitecraft-footer">
      <div class="sitecraft-container sitecraft-footer-inner">
        <div class="sitecraft-footer-about"><span class="sitecraft-footer-brand" data-sitecraft-brand="footer">企业名称</span></div>
        <div>
          <span class="sitecraft-footer-label" data-sitecraft-ui="footerProducts">产品</span>
          <div class="sitecraft-footer-links" data-sitecraft-footer-products></div>
        </div>
        <div>
          <span class="sitecraft-footer-label" data-sitecraft-ui="footerNav">导航</span>
          <div class="sitecraft-footer-links">
            <a href="#industries" data-sitecraft-ui="industries">应用行业</a>
            <a href="#capabilities" data-sitecraft-ui="capabilities">加工能力</a>
            <a href="#services" data-sitecraft-ui="services">合作方式</a>
            <a href="#certifications" data-sitecraft-ui="certifications">认证</a>
            <a href="#contact" data-sitecraft-ui="contact">询盘</a>
          </div>
        </div>
        <div>
          <span class="sitecraft-footer-label" data-sitecraft-ui="footerContact">联系</span>
          <div class="sitecraft-footer-contact">
            <span data-sitecraft-line><span data-sitecraft-ui="emailPrefix">邮箱</span>：<span data-sitecraft-contact="footer-email"></span></span>
            <span data-sitecraft-line><span data-sitecraft-ui="phonePrefix">电话</span>：<span data-sitecraft-contact="footer-phone"></span></span>
          </div>
        </div>
      </div>
    </footer>
  </div>
</body>
