name: sitecraft
services:
  web:
    build: .
    image: sitecraft:local
    init: true
    shm_size: 1gb
    security_opt:
      - seccomp=./deploy/docker/chrome-seccomp.json
    environment:
      SITE_STORE: postgres
      SITECRAFT_DATA_ROOT: /app/data
      DATABASE_URL: postgresql://sitecraft:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/sitecraft
      DEFAULT_WORKSPACE_ID: local
    ports:
      - "127.0.0.1:${SITECRAFT_PORT:-3100}:3000"
    volumes:
      - sitecraft_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 10s
      start_period: 30s
      retries: 3
    restart: unless-stopped
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sitecraft
      POSTGRES_USER: sitecraft
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - sitecraft_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sitecraft -d sitecraft"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
volumes:
  sitecraft_pg:
  sitecraft_data:
